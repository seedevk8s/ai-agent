apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-front-deployment
  labels:
    app: api-front
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-front
  template:
    metadata:
      labels:
        app: api-front
    spec:
      containers:
        - name: api-front
          image: seedevk8s/myagent-front:1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ai-front-service
  labels:
    app: api-front
spec:
  type: NodePort
  selector:
    app: api-front
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
      protocol: TCP
