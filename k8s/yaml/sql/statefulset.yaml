apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sql
  labels:
    app: sql
spec:
  serviceName: sql-headless
  replicas: 1
  selector:
    matchLabels:
      app: sql
  template:
    metadata:
      labels:
        app: sql
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: sql
          image: seedevk8s/myagent-sql:1.0
          imagePullPolicy: Always
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: frodo-db-config
            - secretRef:
                name: frodo-db-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "frodo", "-d", "frodo"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "frodo", "-d", "frodo"]
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: sql-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: sql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
