apiVersion: v1
kind: Service
metadata:
  name: vector-db-headless
  labels:
    app: vector-db
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app: vector-db
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
